
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sastho-Shohoj</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/landing.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
      (function() {
        var saved = localStorage.getItem('eh-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
</head>
<body>
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark Mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="register-container">

        <div class="register-header">
            <h1>Sastho-Shohoj</h1>
            <p>Your health, our priority.</p>
        </div>

        <div class="register-form login-form">

            <h2>Welcome Back!</h2>
            <p class="subtitle">
                Login to access your healthcare account.
            </p>

            <form id="loginForm">

                <label for="loginIdentity">Email or Phone Number</label>
                <input
                    type="text"
                    id="loginIdentity"
                    placeholder="Enter your email or phone number"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="loginPassword">
                        Show
                    </button>
                </div>

                <div class="login-options">

                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">Login</button>

                <p id="loginMessage"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <p class="login-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
            <p class="login-link">
                <a href="../../index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <script src="../../js/theme.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
