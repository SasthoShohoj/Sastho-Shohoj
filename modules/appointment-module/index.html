<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shastho Shohoj - Patient Appointments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/landing.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function() {
      var saved = localStorage.getItem('eh-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div>
        <h2>Shastho Shohoj (স্বাস্থ্যসহজ)</h2>
        <p>Patient Portal &bull; Appointments & Updates</p>
      </div>
      <div class="header-right">
        <a href="../../index.html" class="home-link" title="Back to Home">← Home</a>
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark Mode" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="notification-badge" id="notif-bell" title="Click to view notifications">
          🔔 <span id="unread-count">0</span>
        </div>
      </div>
    </header>

    <!-- Notification Tray -->
    <section id="notification-tray" class="notification-tray hidden">
      <div class="tray-header">
        <h4>Status Updates</h4>
        <button id="clear-notifs-btn">Mark All Read</button>
      </div>
      <ul id="notification-list"></ul>
    </section>

    <!-- Filter Navigation -->
    <nav class="filter-tabs">
      <button class="tab-btn active" data-filter="ALL">All</button>
      <button class="tab-btn" data-filter="REQUESTS">Requests & Pending</button>
      <button class="tab-btn" data-filter="CONFIRMED">Confirmed</button>
    </nav>

    <!-- Appointments Container -->
    <main id="appointments-container" class="appointments-list">
      <!-- Injected via JavaScript -->
    </main>
  </div>

  <!-- Action Modal (Reschedule / Cancel) -->
  <div id="action-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title">Action Title</h3>
      <p id="modal-desc" class="modal-desc"></p>
      
      <div id="reschedule-fields" class="form-group hidden">
        <label for="new-date">Select New Date & Time:</label>
        <input type="datetime-local" id="new-datetime" />
      </div>

      <div class="form-group">
        <label for="reason">Reason / Note:</label>
        <textarea id="action-reason" rows="3" placeholder="Provide additional details..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="cancel-modal-btn" class="btn btn-secondary">Back</button>
        <button id="submit-modal-btn" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../../js/theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
