<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyHealth — Clinical Health Explorer</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- MapLibre GL JS v3.6.2 -->
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fullscreen Map Canvas -->
  <div id="map" class="map-viewport"></div>

  <!-- Top Center Floating Search & Filter Bar -->
  <div class="top-search-filter-container">
    <div class="floating-search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7.5"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="facility-search-input"
        placeholder="Search hospitals, specialists, clinics..."
        autocomplete="off"
      />
      <button id="search-clear-btn" class="search-clear-btn" style="display: none;">✕</button>

      <button id="btn-header-locate" class="header-locate-btn" title="Detect Current Location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
        </svg>
      </button>
    </div>

    <!-- Floating Category Filter Chips -->
    <div class="filter-chips-row">
      <button class="filter-chip chip-hospitals active" data-category="HOSPITAL">Hospitals</button>
      <button class="filter-chip chip-pharmacies active" data-category="PHARMACY">Pharmacies</button>
      <button class="filter-chip chip-diagnostics active" data-category="DIAGNOSTIC">Diagnostics</button>
      <button class="filter-chip chip-blood active" data-category="BLOOD_BANK">Blood Banks</button>
    </div>
  </div>

  <!-- Left Floating Dock & Facility Ledger Panel -->
  <div class="left-floating-container">
    <!-- Slim Vertical Icon Dock -->
    <aside class="vertical-icon-dock">
      <div class="dock-top-group">
        <button class="dock-btn active" id="dock-btn-hospitals" title="Medical Facilities">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16M9 9h6M9 13h6M12 7v8" />
          </svg>
        </button>

        <button class="dock-btn" id="dock-btn-locate" title="Detect Current GPS Location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
          </svg>
        </button>

        <button class="dock-btn" id="dock-btn-list" title="Directory Ledger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>

        <button class="dock-btn" id="dock-btn-categories" title="Medical Categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>

        <button class="dock-btn" id="dock-btn-settings" title="Settings & Tile Providers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <div class="dock-bottom-group">
        <button class="dock-btn" id="dock-btn-collapse" title="Toggle Cards Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Floating Facility Cards Panel -->
    <section class="facility-cards-panel" id="facility-cards-panel">
      <!-- Injected dynamically via app.js -->
    </section>
  </div>

  <!-- Location Permission Prompt Modal -->
  <div class="location-modal-backdrop" id="location-modal-backdrop">
    <div class="location-modal-card">
      <div class="location-icon-bubble">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <h3 class="location-modal-title">Enable Real Location Detection</h3>
      <p class="location-modal-desc">
        EasyHealth uses your current location to discover nearest verified hospitals, 24/7 pharmacies, ICU bed availability, and draw real-time navigation routes.
      </p>
      <div class="location-modal-actions">
        <button id="btn-grant-location" class="btn-location-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
          </svg>
          <span>Allow Location Access</span>
        </button>
        <button id="btn-use-default-location" class="btn-location-secondary">
          Use Khulna / KUET Area
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal (Tile Providers & Map API Key) -->
  <div class="settings-modal-backdrop" id="settings-modal-backdrop">
    <div class="settings-modal-card">
      <div class="settings-modal-header">
        <h3>Map Provider &amp; API Key Settings</h3>
        <button id="btn-close-settings" class="modal-close-btn">✕</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-field">
          <label for="settings-tile-provider">Map Tile Provider</label>
          <select id="settings-tile-provider" class="settings-select">
            <option value="carto-voyager">CartoDB Voyager (Clinical Light Standard)</option>
            <option value="carto-positron">CartoDB Positron (Minimal Monochrome)</option>
            <option value="osm-standard">OpenStreetMap Standard</option>
            <option value="carto-dark">CartoDB Dark Matter</option>
            <option value="maptiler-streets">MapTiler Streets (Vector Tiles)</option>
          </select>
        </div>
        <div class="settings-field" id="settings-api-key-group" style="display: none;">
          <label for="settings-api-key-input">Provider API Key</label>
          <div class="settings-input-row">
            <input type="password" id="settings-api-key-input" placeholder="Paste MapTiler or Mapbox API Key" />
            <button id="btn-save-api-key" class="settings-btn-primary">Save Key</button>
          </div>
          <div id="settings-key-feedback" class="settings-feedback"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
